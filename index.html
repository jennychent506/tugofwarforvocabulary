<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我是全能拼字王！無限輪轉爭霸賽</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --dopa-pink: #ff2a85;
      --dopa-yellow: #ffdf00;
      --dopa-blue: #00d2ff;
      --dopa-green: #05ffa1;
      --dopa-purple: #7928ca;
      --dopa-bg: #fff5ea;
      --dopa-dark: #181824;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    }

    body {
      background-color: var(--dopa-bg);
      background-image: radial-gradient(#ffd3b6 15%, transparent 16%), radial-gradient(#a8e6cf 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      color: var(--dopa-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 頂部多巴胺色彩條 */
    header {
      background: #ffffff;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 5px solid var(--dopa-dark);
      box-shadow: 0 6px 0 rgba(0,0,0,0.1);
    }
    .brand-title {
      font-size: 2.3rem;
      font-weight: 900;
      color: var(--dopa-pink);
      text-shadow: 3px 3px 0 var(--dopa-yellow), 5px 5px 0 var(--dopa-dark);
      letter-spacing: 2px;
    }
    .nav-btns { display: flex; gap: 12px; }
    .btn {
      border: 3.5px solid var(--dopa-dark);
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 900;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 5px 0 var(--dopa-dark);
      transition: all 0.1s;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--dopa-dark);
    }
    .btn-screen { background: var(--dopa-green); color: var(--dopa-dark); }
    .btn-ipad { background: var(--dopa-yellow); color: var(--dopa-dark); }
    .btn-fire { background: var(--dopa-pink); color: #fff; }

    /* 寬版主容器 */
    .view-container { 
      display: none; 
      padding: 20px 24px; 
      width: 98%; 
      max-width: 1800px; 
      margin: 0 auto; 
    }
    .view-container.active { display: block; }

    /* ====== 大螢幕模式 (Home) ====== */
    .admin-card {
      background: #ffffff;
      border: 4px solid var(--dopa-dark);
      border-radius: 24px;
      padding: 20px 28px;
      margin-bottom: 20px;
      box-shadow: 8px 8px 0 var(--dopa-dark);
    }
    .scope-selector {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .scope-chip {
      padding: 8px 20px;
      border: 3px solid var(--dopa-dark);
      border-radius: 30px;
      font-weight: 900;
      font-size: 17px;
      cursor: pointer;
      background: #f1f5f9;
      box-shadow: 0 4px 0 var(--dopa-dark);
      transition: all 0.1s;
    }
    .scope-chip.active {
      background: var(--dopa-yellow);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--dopa-dark);
    }

    .names-area {
      width: 100%;
      height: 70px;
      border: 3px solid var(--dopa-dark);
      border-radius: 16px;
      padding: 10px 16px;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 14px;
      background: #fafafa;
    }

    /* 三欄超寬面板 */
    .arena-dashboard {
      display: grid;
      grid-template-columns: 1.65fr 1.15fr 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1200px) {
      .arena-dashboard { grid-template-columns: 1fr; }
    }

    .box-card {
      background: #ffffff;
      border: 4px solid var(--dopa-dark);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 6px 6px 0 var(--dopa-dark);
    }
    .box-header {
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 3px dashed #cbd5e1;
    }

    /* 對戰卡片：強化不換行 (nowrap) 與彈性配置 */
    .match-list-scroll {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 750px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .match-item {
      background: #f8fafc;
      border: 3.5px solid var(--dopa-dark);
      border-radius: 18px;
      padding: 12px 18px;
      box-shadow: 0 4px 0 var(--dopa-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      overflow: hidden;
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .match-item.done {
      background: #e6fffa;
      border-color: #059669;
    }

    .table-badge-ui {
      font-weight: 900;
      background: var(--dopa-yellow);
      padding: 6px 14px;
      border-radius: 12px;
      border: 3px solid var(--dopa-dark);
      font-size: 17px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .vs-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      flex-shrink: 1;
    }

    .p-tag {
      font-size: 19px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 10px;
      white-space: nowrap;
      display: inline-block;
    }
    .p-tag.winner-mark {
      background: var(--dopa-green);
      border: 2px solid var(--dopa-dark);
    }

    .match-status-label {
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 得分排行榜清單 */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 750px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .rank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 14px;
      border: 3px solid var(--dopa-dark);
      background: #fff;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 4px 0 var(--dopa-dark);
      white-space: nowrap;
    }
    .rank-row:nth-child(1) { background: #fff9c4; font-size: 20px; }
    .rank-row:nth-child(2) { background: #e0f2fe; }
    .rank-row:nth-child(3) { background: #ffedd5; }
    .score-badge {
      background: var(--dopa-pink);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 900;
    }

    /* ====== 學生 iPad 登入端 ====== */
    #playerLoginView {
      max-width: 480px;
      margin: 60px auto;
      background: #fff;
      border: 5px solid var(--dopa-dark);
      border-radius: 30px;
      padding: 36px;
      box-shadow: 10px 10px 0 var(--dopa-dark);
      text-align: center;
    }
    .dopa-input {
      width: 100%;
      padding: 16px;
      border: 3px solid var(--dopa-dark);
      border-radius: 18px;
      font-size: 22px;
      font-weight: 900;
      margin-top: 10px;
      margin-bottom: 22px;
      text-align: center;
      background: #fffdf5;
    }

    /* ====== 拔河對戰實體 (iPad 巨型超大字體視角) ====== */
    #arenaView {
      position: fixed;
      inset: 0;
      background: var(--dopa-bg);
      z-index: 1000;
      display: none;
      flex-direction: column;
    }
    .player-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 24px;
      position: relative;
    }
    .player-zone.p1-up {
      transform: rotate(180deg);
      background: linear-gradient(180deg, #ffc0d3 0%, #fff1f5 100%);
      border-bottom: 5px solid var(--dopa-dark);
    }
    .player-zone.p2-down {
      background: linear-gradient(180deg, #dcfce7 0%, #f0fdf4 100%);
      border-top: 5px solid var(--dopa-dark);
    }

    .p-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .p-name-badge {
      font-size: 26px;
      font-weight: 900;
      padding: 6px 20px;
      border-radius: 50px;
      border: 4px solid var(--dopa-dark);
      box-shadow: 0 4px 0 var(--dopa-dark);
    }
    .p-name-badge.red { background: var(--dopa-pink); color: #fff; }
    .p-name-badge.blue { background: var(--dopa-blue); color: var(--dopa-dark); }

    .word-def-box {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      color: var(--dopa-dark);
      background: #ffffff;
      border: 4px solid var(--dopa-dark);
      border-radius: 20px;
      padding: 10px 18px;
      box-shadow: 0 6px 0 var(--dopa-dark);
      max-width: 900px;
      margin: 4px auto;
      line-height: 1.3;
    }

    .slots-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 56px;
      margin: 4px 0;
    }
    .tile {
      width: 44px;
      height: 54px;
      border: 3.5px solid var(--dopa-dark);
      border-radius: 12px;
      background: #ffffff;
      font-size: 32px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      box-shadow: 0 5px 0 var(--dopa-dark);
    }
    .tile.active-char {
      background: var(--dopa-yellow);
      color: var(--dopa-dark);
      transform: scale(1.08);
      border-color: var(--dopa-dark);
    }
    .tile.space-tile {
      border: none;
      background: transparent;
      box-shadow: none;
      width: 20px;
    }

    .keyboard-wrapper {
      max-width: 840px;
      margin: 0 auto;
      width: 100%;
    }
    .key-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    .dopa-key {
      flex: 1;
      height: 52px;
      max-width: 66px;
      border: 3.5px solid var(--dopa-dark);
      border-radius: 14px;
      background: #ffffff;
      color: var(--dopa-dark);
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 5px 0 var(--dopa-dark);
      cursor: pointer;
    }
    .dopa-key:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--dopa-dark);
      background: var(--dopa-yellow);
    }
    .dopa-key.action-btn {
      flex: 1.6;
      max-width: 94px;
      font-size: 18px;
      background: #ffd3b6;
    }

    .arena-divider {
      height: 68px;
      background: var(--dopa-yellow);
      border-top: 5px solid var(--dopa-dark);
      border-bottom: 5px solid var(--dopa-dark);
      display: flex;
      align-items: center;
      position: relative;
      padding: 0 30px;
    }
    .giant-rope {
      width: 100%;
      height: 18px;
      background: #a16207;
      border: 3.5px solid var(--dopa-dark);
      border-radius: 999px;
      position: relative;
    }
    .bow-ribbon {
      position: absolute;
      width: 36px;
      height: 50px;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--dopa-pink);
      border: 3.5px solid var(--dopa-dark);
      border-radius: 10px;
      box-shadow: 0 0 18px rgba(255, 42, 133, 0.9);
      transition: left 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body>

  <!-- 頂部多巴胺列 -->
  <header>
    <div class="brand-title">👑 我是全能拼字王！無限輪轉爭霸賽</div>
    <div class="nav-btns">
      <button class="btn btn-screen" onclick="switchView('hostView')">🖥️ 大螢幕對戰首頁</button>
      <button class="btn btn-ipad" onclick="switchView('playerLoginView')">📱 學生 iPad 對戰端</button>
    </div>
  </header>

  <!-- 1. 大螢幕首頁 (Home) -->
  <div id="hostView" class="view-container active">
    <div class="admin-card">
      <div class="scope-selector">
        <span style="font-weight:900; font-size:19px;">🎯 本次對戰範圍：</span>
        <div class="scope-chip active" id="chipL1" onclick="toggleScope('L1')">B3L1</div>
        <div class="scope-chip active" id="chipL2" onclick="toggleScope('L2')">B3L2</div>
        <div class="scope-chip active" id="chipL3" onclick="toggleScope('L3')">B3L3</div>
        <span style="color:#64748b; font-size:16px; margin-left:auto; font-weight:800;">（勝部或復活戰打贏皆得 +2 分並不斷開戰！）</span>
      </div>

      <div style="font-weight:900; font-size:18px; margin-bottom:8px;">👥 參賽同學名單（座號或姓名）：</div>
      <textarea id="studentListInput" class="names-area">1號, 2號, 3號, 4號, 5號, 6號, 7號, 8號</textarea>
      
      <div style="display:flex; gap:14px; flex-wrap:wrap;">
        <button class="btn btn-fire" onclick="startTournament()">🎲 隨機分組並展開對戰</button>
        <button class="btn btn-screen" onclick="resetAll()">🔄 清空比賽記錄</button>
      </div>
    </div>

    <!-- 三欄超寬面板 -->
    <div class="arena-dashboard">
      <!-- 左側：主對決戰局（勝部 + 復活回歸的全新戰局） -->
      <div class="box-card">
        <div class="box-header">
          <span>🏆 主戰局對決區 (持續輪轉開打)</span>
          <span style="font-size:14px; color:#10b981;">● 即時配對中</span>
        </div>
        <div class="match-list-scroll" id="mainBracketList">
          <p style="color:#94a3b8; font-weight:800; font-size:17px;">點選上方「隨機分組」即刻點燃戰火！</p>
        </div>
      </div>

      <!-- 中間：敗部復活區 -->
      <div class="box-card">
        <div class="box-header">
          <span style="color:var(--dopa-pink);">🔥 敗部復活區 (獲勝回歸主戰局)</span>
        </div>
        <div class="match-list-scroll" id="redemptionBracketList">
          <p style="color:#94a3b8; font-weight:800; font-size:17px;">落敗選手將自動依序排入復活戰，贏了立刻殺回左邊！</p>
        </div>
      </div>

      <!-- 右側：積分排行榜 -->
      <div class="box-card" style="background: #fffcf2;">
        <div class="box-header">
          <span style="color:var(--dopa-purple);">👑 全班積分排行榜</span>
          <span style="font-size:15px; color:#64748b;">每勝 +2 分</span>
        </div>
        <div class="leaderboard-list" id="leaderboardView">
          <p style="color:#94a3b8; font-weight:800; font-size:17px;">比賽開始後即時計分...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 學生 iPad 登入端 -->
  <div id="playerLoginView" class="view-container">
    <h2 style="font-size:32px; font-weight:900; color:var(--dopa-pink); margin-bottom:10px;">👑 我是全能拼字王！</h2>
    <p style="color:#64748b; font-weight:800; font-size:18px; margin-bottom:24px;">請查看黑板上的桌號並輸入：</p>
    
    <label style="font-weight:900; font-size:18px;">你的對戰桌號 (輸入數字，如 1、2、10... 或復活桌 R1、R2...)</label>
    <input type="text" id="tblNumber" class="dopa-input" value="1" placeholder="例如：1 或 R1">

    <label style="font-weight:900; font-size:18px;">選擇你的站位</label>
    <select id="playerSide" class="dopa-input">
      <option value="1">🔴 紅方選手（上方旋轉視角）</option>
      <option value="2">🔵 藍方選手（下方視角）</option>
    </select>

    <button class="btn btn-fire" style="width:100%; padding:16px; font-size:24px;" onclick="enterBattle()">🚀 進入戰場！</button>
  </div>

  <!-- 3. 拔河戰鬥畫面 (iPad 面對面) -->
  <div id="arenaView">
    <div class="player-zone p1-up">
      <div class="p-status-bar">
        <span class="p-name-badge red" id="p1NameTag">🔴 紅方隊友</span>
        <span style="font-size:26px; font-weight:900;" id="p1StepLabel">拉動: 0</span>
      </div>
      <div class="word-def-box" id="p1Prompt">準備中...</div>
      <div class="slots-row" id="p1Tiles"></div>
      <div class="keyboard-wrapper" id="p1KeyboardArea"></div>
    </div>

    <div class="arena-divider">
      <div class="giant-rope">
        <div class="bow-ribbon" id="bowRibbon"></div>
      </div>
    </div>

    <div class="player-zone p2-down">
      <div class="p-status-bar">
        <span class="p-name-badge blue" id="p2NameTag">🔵 藍方隊友</span>
        <span style="font-size:26px; font-weight:900;" id="p2StepLabel">拉動: 0</span>
      </div>
      <div class="word-def-box" id="p2Prompt">準備中...</div>
      <div class="slots-row" id="p2Tiles"></div>
      <div class="keyboard-wrapper" id="p2KeyboardArea"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 1. FIREBASE 雲端即時連線設定
    // ==========================================
    const firebaseConfig = {
      databaseURL: "https://vocab-tournament-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 完整三課單字片語資料庫
    const FULL_DICTIONARY = {
      L1: [
        { word: "after all", def: "畢竟" }, { word: "be about to", def: "即將；正要" }, { word: "cheer up", def: "使......振奮、高興" },
        { word: "confine", def: "(vt.) 侷限；限定；使離不開（床等）" }, { word: "contact", def: "(n./vt.) 接觸；聯絡" },
        { word: "corporate", def: "(adj.) （大）公司的" }, { word: "corporation", def: "(n.) 大公司；集團公司" },
        { word: "drowsy", def: "(adj.) 昏昏欲睡的" }, { word: "employ", def: "(vt.) 僱用" }, { word: "employee", def: "(n.) 員工；受僱者" },
        { word: "employer", def: "(n.) 雇主" }, { word: "employment", def: "(n.) 工作；受僱" }, { word: "frail", def: "(adj.) 虛弱的" },
        { word: "fright", def: "(n.) 驚嚇" }, { word: "frighten", def: "(vt.) 使驚嚇" }, { word: "germ", def: "(n.) 細菌" },
        { word: "hesitate", def: "(vi.) 猶豫" }, { word: "hesitation", def: "(n.) 猶豫" }, { word: "hug", def: "(n./vt.) 擁抱" },
        { word: "ill", def: "(adj.) 生病的" }, { word: "illness", def: "(n.) 疾病；生病" }, { word: "laughter", def: "(n.) 笑；笑聲" },
        { word: "make a difference", def: "有所影響" }, { word: "pass away", def: "過世" }, { word: "pass on to", def: "將......傳給......" },
        { word: "prompt", def: "(vt.) 促使 (adj.) 立即的" }, { word: "refusal", def: "(n.) 拒絕" }, { word: "refuse", def: "(vi./vt.) 拒絕" },
        { word: "sparkle", def: "(vi./n.) 閃耀；神采" }, { word: "stretch", def: "(vt.) 伸出（手臂腿）；拉長" }, { word: "suffer", def: "(vt./vi.) 受苦" },
        { word: "terminal", def: "(adj.) 末期的 (n.) 航廈；總站" }, { word: "tremendous", def: "(adj.) 相當大的" }, { word: "turn down", def: "拒絕......" },
        { word: "warmth", def: "(n.) 熱情；溫暖" }
      ],
      L2: [
        { word: "adjust", def: "(vt.) 調整" }, { word: "adjustment", def: "(n.) 調整" }, { word: "architect", def: "(n.) 建築師" },
        { word: "architecture", def: "(n.) 建築" }, { word: "capability", def: "(n.) 能力" }, { word: "capable", def: "(adj.) 有能力的" },
        { word: "collaborate", def: "(vi.) 合作" }, { word: "collaboration", def: "(n.) 合作" }, { word: "construct", def: "(vt.) 建造" },
        { word: "construction", def: "(n.) 建築物；建造" }, { word: "constructive", def: "(adj.) 有建設性的" }, { word: "element", def: "(n.) 要素" },
        { word: "elementary", def: "(adj.) 基礎的；初級的" }, { word: "exploration", def: "(n.) 探索；探究" }, { word: "explore", def: "(vt.) 探索" },
        { word: "feedback", def: "(n.) 回饋意見" }, { word: "figure out", def: "想出" }, { word: "get down to", def: "開始做某事" },
        { word: "graduate", def: "(n.) 大學畢業生 (vi.) 畢業" }, { word: "graduation", def: "(n.) 畢業" }, { word: "in charge", def: "主控；負責" },
        { word: "innovate", def: "(vi.) 創新" }, { word: "innovation", def: "(n.) 新方法" }, { word: "innovative", def: "(adj.) 創新的" },
        { word: "material", def: "(n.) 材料" }, { word: "mention", def: "(vt.) 提到" }, { word: "promise", def: "(vt./n.) 承諾；可望" },
        { word: "rank", def: "(v.) 排序為⋯⋯" }, { word: "ranking", def: "(n.) 排名" }, { word: "reliable", def: "(adj.) 可信賴的" },
        { word: "rely", def: "(vi.) 依賴；信任" }, { word: "roll up one's sleeves", def: "挽起袖子（開始行動）" }, { word: "route", def: "(n.) 途徑；路線" },
        { word: "slight", def: "(adj.) 細微的" }, { word: "stability", def: "(n.) 穩定" }, { word: "stable", def: "(adj.) 穩固的" },
        { word: "structure", def: "(n.) 結構體" }, { word: "trial and error", def: "反覆試驗" }, { word: "unique", def: "(adj.) 獨特的" }
      ],
      L3: [
        { word: "as a result", def: "因此" }, { word: "banish", def: "(vt.) 放逐" }, { word: "banishment", def: "(n.) 放逐" },
        { word: "beneficial", def: "(adj.) 有利的；有幫助的" }, { word: "benefit", def: "(n.) 益處 (vt.) 對⋯⋯有益" },
        { word: "civilization", def: "(n.) 文明" }, { word: "conflict", def: "(n./vi.) 衝突；牴觸" }, { word: "distribute", def: "(vt.) 分發；分配" },
        { word: "distribution", def: "(n.) 分配；分布" }, { word: "enable", def: "(vt.) 使⋯⋯能夠⋯⋯" }, { word: "fall victim to", def: "成為......的受害者" },
        { word: "feed on", def: "靠......為食" }, { word: "freeze", def: "(vi./vt.) 受凍；冷凍；凍結" }, { word: "fur", def: "(n.) （動物的）毛皮" },
        { word: "furious", def: "(adj.) 暴怒的" }, { word: "fury", def: "(n.) 狂怒" }, { word: "generosity", def: "(n.) 慷慨" },
        { word: "generous", def: "(adj.) 慷慨的" }, { word: "hollow", def: "(adj.) 中空的" }, { word: "humankind", def: "(n.) 人類" },
        { word: "make up for", def: "彌補" }, { word: "miserable", def: "(adj.) 悲慘的" }, { word: "misery", def: "(n.) 慘況" },
        { word: "punish", def: "(vt.) 懲罰" }, { word: "punishment", def: "(n.) 懲罰" }, { word: "run out of", def: "用完" },
        { word: "set the stage for", def: "為......做好準備" }, { word: "slaughter", def: "(vt./n.) 宰殺；屠殺" }, { word: "theft", def: "(n.) 偷竊罪" },
        { word: "torture", def: "(vt./n.) 折磨" }, { word: "underneath", def: "(prep.) 在⋯⋯下" }, { word: "universal", def: "(adj.) 普遍的" },
        { word: "universe", def: "(n.) 宇宙" }, { word: "upright", def: "(adj./adv.) 直立的；直立地" }, { word: "victim", def: "(n.) 受害者；罹難者" }
      ]
    };

    let selectedLessons = ['L1', 'L2', 'L3'];

    function toggleScope(l) {
      const chip = document.getElementById(`chip${l}`);
      if (selectedLessons.includes(l)) {
        if (selectedLessons.length === 1) return;
        selectedLessons = selectedLessons.filter(item => item !== l);
        chip.classList.remove('active');
      } else {
        selectedLessons.push(l);
        chip.classList.add('active');
      }
      db.ref('tournament/settings/scope').set(selectedLessons);
    }

    function switchView(id) {
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ==========================================
    // 🖥️ 教師大螢幕邏輯：動態滾動輪轉配對
    // ==========================================
    function startTournament() {
      const raw = document.getElementById('studentListInput').value;
      const names = raw.split(/[\n,，]+/).map(s => s.trim()).filter(s => s);
      if (names.length < 2) {
        alert("請至少輸入兩位同學名單！");
        return;
      }

      const shuffled = [...names].sort(() => Math.random() - 0.5);
      const matches = {};
      const initialScores = {};

      names.forEach(name => { initialScores[name] = 0; });

      let tableCount = 1;
      for (let i = 0; i < shuffled.length; i += 2) {
        if (i + 1 < shuffled.length) {
          matches[`match_${tableCount}`] = {
            table: `${tableCount}`,
            p1: shuffled[i],
            p2: shuffled[i+1],
            winner: null,
            round: 1
          };
          tableCount++;
        } else {
          // 單數輪空直接加 2 分
          const lucky = shuffled[i];
          initialScores[lucky] = 2;
          matches[`match_${tableCount}`] = {
            table: `${tableCount}`,
            p1: lucky,
            p2: "（輪空保送）",
            winner: lucky,
            round: 1
          };
        }
      }

      db.ref('tournament').set({
        matches: matches,
        scores: initialScores,
        redemption: {},
        mainWaitingPool: [], // 勝部或復活打贏後等待配對的人
        loserWaitingPool: [], // 剛輸掉等待進復活賽的人
        maxTableNumber: tableCount,
        settings: { scope: selectedLessons }
      });
    }

    function resetAll() {
      if (confirm("確定要清空所有比分與對戰記錄嗎？")) {
        db.ref('tournament').remove();
      }
    }

    // 監聽雲端並動態維護「無限輪轉配對」
    db.ref('tournament').on('value', (snap) => {
      const data = snap.val();
      if (!data) {
        document.getElementById('mainBracketList').innerHTML = '<p style="color:#94a3b8; font-weight:800; font-size:17px;">點選上方「隨機分組」即刻點燃戰火！</p>';
        document.getElementById('redemptionBracketList').innerHTML = '<p style="color:#94a3b8; font-weight:800; font-size:17px;">落敗選手將自動依序排入復活戰，贏了立刻殺回左邊！</p>';
        document.getElementById('leaderboardView').innerHTML = '<p style="color:#94a3b8; font-weight:800; font-size:17px;">比賽開始後即時計分...</p>';
        return;
      }

      // 1. 渲染左側主戰場
      renderMainMatches(data.matches || {});

      // 2. 渲染中間敗部復活戰場
      renderRedemptionMatches(data.redemption || {});

      // 3. 渲染右側積分榜
      renderLeaderboard(data.scores || {});
    });

    function renderMainMatches(matches) {
      const mainList = document.getElementById('mainBracketList');
      mainList.innerHTML = '';
      const matchKeys = Object.keys(matches).sort((a, b) => {
        const numA = parseInt(a.replace('match_', ''), 10) || 0;
        const numB = parseInt(b.replace('match_', ''), 10) || 0;
        return numB - numA; // 最新的戰局置頂，方便學生查看
      });

      if (matchKeys.length === 0) {
        mainList.innerHTML = '<p style="color:#94a3b8; font-weight:800; font-size:17px;">戰局等待中...</p>';
        return;
      }

      matchKeys.forEach(k => {
        const m = matches[k];
        const card = document.createElement('div');
        card.className = `match-item ${m.winner ? 'done' : ''}`;
        card.innerHTML = `
          <span class="table-badge-ui">第 ${m.table} 桌</span>
          <div class="vs-wrap">
            <span class="p-tag ${m.winner === m.p1 ? 'winner-mark' : ''}">🔴 ${m.p1}</span>
            <span style="font-size:16px; font-weight:900; color:#94a3b8;">VS</span>
            <span class="p-tag ${m.winner === m.p2 ? 'winner-mark' : ''}">🔵 ${m.p2}</span>
          </div>
          <span class="match-status-label" style="color:${m.winner ? '#059669':'#e11d48'};">
            ${m.winner ? '🎉 ' + m.winner + ' 勝出 (+2分)' : '⚔️ 對決中'}
          </span>
        `;
        mainList.appendChild(card);
      });
    }

    function renderRedemptionMatches(redemption) {
      const redElem = document.getElementById('redemptionBracketList');
      redElem.innerHTML = '';
      const rKeys = Object.keys(redemption).sort((a, b) => {
        const numA = parseInt(a.replace('match_R', ''), 10) || 0;
        const numB = parseInt(b.replace('match_R', ''), 10) || 0;
        return numB - numA;
      });

      if (rKeys.length === 0) {
        redElem.innerHTML = '<p style="color:#94a3b8; font-weight:800; font-size:17px;">目前全員在主戰場！落敗選手將自動依序排入復活戰...</p>';
        return;
      }

      rKeys.forEach(k => {
        const rm = redemption[k];
        const card = document.createElement('div');
        card.className = `match-item ${rm.winner ? 'done' : ''}`;
        card.innerHTML = `
          <span class="table-badge-ui" style="background:#ffc0d3;">復活桌 ${rm.table}</span>
          <div class="vs-wrap">
            <span class="p-tag ${rm.winner === rm.p1 ? 'winner-mark' : ''}">🔥 ${rm.p1}</span>
            <span style="font-size:16px; font-weight:900; color:#94a3b8;">VS</span>
            <span class="p-tag ${rm.winner === rm.p2 ? 'winner-mark' : ''}">🔥 ${rm.p2}</span>
          </div>
          <span class="match-status-label" style="color:${rm.winner ? '#059669':'var(--dopa-pink)'};">
            ${rm.winner ? '🔥 ' + rm.winner + ' 成功復活回歸左邊！(+2分)' : '贏家立刻回歸左側主戰局！'}
          </span>
        `;
        redElem.appendChild(card);
      });
    }

    function renderLeaderboard(scores) {
      const list = document.getElementById('leaderboardView');
      list.innerHTML = '';
      const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);

      if (sorted.length === 0) {
        list.innerHTML = '<p style="color:#94a3b8; font-weight:800; font-size:17px;">暫無積分記錄</p>';
        return;
      }

      sorted.forEach(([name, score], idx) => {
        const row = document.createElement('div');
        row.className = 'rank-row';
        const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `#${idx+1}`));
        row.innerHTML = `
          <span>${medal} <strong>${name}</strong></span>
          <span class="score-badge">${score} 分</span>
        `;
        list.appendChild(row);
      });
    }

    // ==========================================
    // 📱 學生 iPad 對戰與智慧排程系統
    // ==========================================
    let activeTableCode = "1";
    let isRedemptionMatch = false;
    let matchInfo = null;
    let tugState = 0;
    const p1 = { typed: '', target: null };
    const p2 = { typed: '', target: null };

    function enterBattle() {
      const inputVal = document.getElementById('tblNumber').value.trim();
      if (!inputVal) {
        alert("請輸入桌號！");
        return;
      }

      activeTableCode = inputVal.toUpperCase();
      isRedemptionMatch = activeTableCode.startsWith('R');
      const activeMatchPath = isRedemptionMatch 
        ? `tournament/redemption/match_${activeTableCode}` 
        : `tournament/matches/match_${activeTableCode}`;

      db.ref(activeMatchPath).once('value', (snap) => {
        matchInfo = snap.val();
        if (!matchInfo) {
          alert(`找不到【${activeTableCode}】的對戰資訊！請確認大螢幕上是否有此桌。`);
          return;
        }

        if (matchInfo.winner) {
          alert(`這桌（${activeTableCode}）已經分出勝負囉！請查看大螢幕找新桌號。`);
          return;
        }

        document.getElementById('arenaView').style.display = 'flex';
        document.getElementById('p1NameTag').innerText = `🔴 ${matchInfo.p1}`;
        document.getElementById('p2NameTag').innerText = `🔵 ${matchInfo.p2}`;

        // 讀取出題範圍
        db.ref('tournament/settings/scope').once('value', (scSnap) => {
          const scope = scSnap.val() || ['L1', 'L2', 'L3'];
          buildPool(scope);
          initArena();
        });
      });
    }

    let battlePool = [];
    function buildPool(scopeList) {
      battlePool = [];
      scopeList.forEach(l => {
        if (FULL_DICTIONARY[l]) {
          battlePool.push(...FULL_DICTIONARY[l]);
        }
      });
    }

    function initArena() {
      tugState = 0;
      renderKeys('p1KeyboardArea', 1);
      renderKeys('p2KeyboardArea', 2);
      nextWord(1);
      nextWord(2);
      refreshRope();
    }

    function sanitizeWord(w) { return w.toLowerCase().replace(/[^a-z\s']/g, ''); }

    function nextWord(pId) {
      const q = battlePool[Math.floor(Math.random() * battlePool.length)];
      if (pId === 1) {
        p1.target = q; p1.typed = '';
        renderPlayerTiles(1);
      } else {
        p2.target = q; p2.typed = '';
        renderPlayerTiles(2);
      }
    }

    function renderPlayerTiles(pId) {
      const state = pId === 1 ? p1 : p2;
      const promptElem = document.getElementById(pId === 1 ? 'p1Prompt' : 'p2Prompt');
      const tilesWrap = document.getElementById(pId === 1 ? 'p1Tiles' : 'p2Tiles');

      promptElem.innerText = state.target.def;
      tilesWrap.innerHTML = '';
      const cleaned = sanitizeWord(state.target.word);

      for (let i = 0; i < cleaned.length; i++) {
        const char = cleaned[i];
        const tile = document.createElement('div');
        if (char === ' ') {
          tile.className = 'tile space-tile';
        } else {
          tile.className = 'tile';
          if (i < state.typed.length) {
            tile.innerText = state.typed[i];
            tile.classList.add('active-char');
          }
        }
        tilesWrap.appendChild(tile);
      }
    }

    function pressKey(pId, key) {
      if (Math.abs(tugState) >= 5) return;
      const state = pId === 1 ? p1 : p2;
      const target = sanitizeWord(state.target.word);

      if (key === 'CLEAR') {
        state.typed = '';
      } else if (key === 'DEL') {
        state.typed = state.typed.slice(0, -1);
      } else {
        let nextIdx = state.typed.length;
        if (target[nextIdx] === ' ') {
          state.typed += ' ';
          nextIdx++;
        }
        if (state.typed.length < target.length && key === target[nextIdx].toUpperCase()) {
          state.typed += key.toLowerCase();

          if (state.typed === target) {
            // 答對，拉繩一步！
            if (pId === 1) tugState -= 1;
            else tugState += 1;
            refreshRope();

            if (Math.abs(tugState) >= 5) {
              const winner = tugState <= -5 ? matchInfo.p1 : matchInfo.p2;
              const loser = (winner === matchInfo.p1) ? matchInfo.p2 : matchInfo.p1;
              
              alert(`🎉 恭喜 ${winner} 獲勝！勇奪 +2 分！\n結果已回傳，大螢幕將自動安排下一輪戰局！`);
              
              // 處理結果與自動配對
              finishMatchAndAutoSchedule(winner, loser);

              document.getElementById('arenaView').style.display = 'none';
              switchView('playerLoginView');
              return;
            }
            nextWord(pId);
            return;
          }
        }
      }
      renderPlayerTiles(pId);
    }

    // 核心：分出勝負後的智慧動態排程機制
    function finishMatchAndAutoSchedule(winner, loser) {
      const activeMatchPath = isRedemptionMatch 
        ? `tournament/redemption/match_${activeTableCode}` 
        : `tournament/matches/match_${activeTableCode}`;

      // 1. 標記當前戰局獲勝者，並在雲端 +2 分
      db.ref(activeMatchPath).update({ winner: winner });
      db.ref(`tournament/scores/${winner}`).transaction((cur) => (cur || 0) + 2);

      // 2. 獲勝者進入「主戰場待配對池」（無論來自勝部還是剛從敗部復活！）
      //    只要滿 2 人，立刻在左邊主戰區生成一桌新對決！
      db.ref('tournament').transaction((currentData) => {
        if (!currentData) return currentData;

        let mainWaiting = currentData.mainWaitingPool || [];
        let loserWaiting = currentData.loserWaitingPool || [];
        let matches = currentData.matches || {};
        let redemption = currentData.redemption || {};
        let maxTable = currentData.maxTableNumber || 100;

        // --- 處理贏家（重返左邊主戰場）---
        if (!mainWaiting.includes(winner)) {
          mainWaiting.push(winner);
        }

        if (mainWaiting.length >= 2) {
          const pA = mainWaiting.shift();
          const pB = mainWaiting.shift();
          maxTable++;
          matches[`match_${maxTable}`] = {
            table: `${maxTable}`,
            p1: pA,
            p2: pB,
            winner: null
          };
        }

        // --- 處理輸家（進入敗部復活戰）---
        // 如果是在復活賽又輸了，依舊讓他留在敗部池繼續找其他同學對決，無限重玩！
        if (!loserWaiting.includes(loser)) {
          loserWaiting.push(loser);
        }

        if (loserWaiting.length >= 2) {
          const lA = loserWaiting.shift();
          const lB = loserWaiting.shift();
          const rCount = Object.keys(redemption).length + 1;
          redemption[`match_R${rCount}`] = {
            table: `R${rCount}`,
            p1: lA,
            p2: lB,
            winner: null
          };
        }

        currentData.mainWaitingPool = mainWaiting;
        currentData.loserWaitingPool = loserWaiting;
        currentData.matches = matches;
        currentData.redemption = redemption;
        currentData.maxTableNumber = maxTable;

        return currentData;
      });
    }

    function refreshRope() {
      const bow = document.getElementById('bowRibbon');
      bow.style.left = `${50 + (tugState * 8)}%`;
      document.getElementById('p1StepLabel').innerText = `拉動: ${Math.max(0, -tugState)}`;
      document.getElementById('p2StepLabel').innerText = `拉動: ${Math.max(0, tugState)}`;
    }

    const DOPA_KEYS = [
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L'],
      ['DEL','Z','X','C','V','B','N','M','CLEAR']
    ];

    function renderKeys(containerId, pId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      DOPA_KEYS.forEach(row => {
        const r = document.createElement('div');
        r.className = 'key-row';
        row.forEach(k => {
          const btn = document.createElement('button');
          btn.className = 'dopa-key' + (k.length > 1 ? ' action-btn' : '');
          btn.innerText = k;
          btn.onpointerdown = (e) => { e.preventDefault(); pressKey(pId, k); };
          r.appendChild(btn);
        });
        container.appendChild(r);
      });
    }
  </script>
