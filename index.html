<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>B3 英文單字片語全班拔河錦標賽</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 頂部導覽列 */
    header {
      background: #1e293b;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
    }
    h1 { font-size: 1.2rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .nav-btns { display: flex; gap: 10px; }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-green { background: #10b981; }
    .btn-orange { background: #f59e0b; }
    .btn-red { background: #ef4444; }

    /* 視圖切換 */
    .view-container { display: none; padding: 20px; }
    .view-container.active { display: block; }

    /* ====== 大螢幕模式 (Host View) ====== */
    .admin-panel {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .admin-panel textarea {
      flex: 1;
      min-width: 280px;
      height: 60px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
    }

    /* 對戰樹狀圖 / 錦標賽看板 */
    .bracket-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) {
      .bracket-wrapper { grid-template-columns: 1fr; }
    }
    .bracket-section {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #334155;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .match-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .match-card.finished { border-color: #10b981; }
    .match-card.playing { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
    .table-badge {
      font-size: 12px;
      background: #334155;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      color: #94a3b8;
    }
    .players-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: bold;
    }
    .player-slot {
      padding: 4px 10px;
      border-radius: 4px;
      background: #1e293b;
    }
    .player-slot.winner { background: #10b981; color: #fff; }
    .vs-tag { font-size: 12px; color: #64748b; }

    /* ====== 學生 iPad 模式 (Player View) ====== */
    #playerLoginView {
      max-width: 400px;
      margin: 40px auto;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      font-size: 16px;
    }

    /* ====== 拔河對戰本體 (iPad Facing Screen) ====== */
    #arenaView {
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 100;
      display: none;
      flex-direction: column;
    }
    .player-half {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 16px;
      position: relative;
    }
    .player-half.p1-top {
      transform: rotate(180deg);
      background: linear-gradient(180deg, #1e1e2e 0%, #2a1b24 100%);
    }
    .player-half.p2-bottom {
      background: linear-gradient(180deg, #16243b 0%, #1e1e2e 100%);
    }
    .p-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
    }
    .def-box {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: #fef08a;
      min-height: 28px;
    }
    .slots-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
    }
    .slot {
      width: 26px;
      height: 34px;
      border-bottom: 3px solid #64748b;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
    }
    .slot.filled { border-color: #38bdf8; color: #38bdf8; }
    .slot.space { width: 14px; border-bottom: none; }

    /* 鍵盤 */
    .kb-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 4px; }
    .kb-key {
      flex: 1;
      max-width: 48px;
      height: 38px;
      border: none;
      border-radius: 6px;
      background: #334155;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 2px 0 #0f172a;
    }
    .kb-key:active { transform: translateY(2px); box-shadow: none; }
    .kb-key.func { flex: 1.5; font-size: 12px; background: #475569; }

    /* 中央繩子 */
    .tug-center {
      height: 60px;
      background: #020617;
      border-top: 2px solid #334155;
      border-bottom: 2px solid #334155;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }
    .rope {
      width: 100%;
      height: 12px;
      background: #78350f;
      border-radius: 6px;
      position: relative;
    }
    .ribbon {
      position: absolute;
      width: 22px;
      height: 32px;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: #ef4444;
      border: 2px solid #fff;
      border-radius: 4px;
      transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body>

  <!-- 頂部導航 -->
  <header>
    <h1>⚔️ B3 單字錦標賽即時主控台</h1>
    <div class="nav-btns">
      <button class="btn btn-green" onclick="showView('hostView')">🖥️ 大螢幕對戰表</button>
      <button class="btn btn-orange" onclick="showView('playerLoginView')">📱 學生 iPad 對戰端</button>
    </div>
  </header>

  <!-- 1. 教師大螢幕端 (Host View) -->
  <div id="hostView" class="view-container active">
    <div class="admin-panel">
      <div style="width: 100%; font-size: 13px; color: #94a3b8; margin-bottom: 4px;">
        📝 請輸入學生座號或姓名（逗號或換行分隔）：
      </div>
      <textarea id="studentNames">1號, 2號, 3號, 4號, 5號, 6號, 7號, 8號</textarea>
      <button class="btn btn-green" onclick="generateTournament()">🎲 隨機分組並發布對戰</button>
      <button class="btn btn-red" onclick="resetTournament()">🔄 重置比賽</button>
    </div>

    <div class="bracket-wrapper">
      <!-- 勝部賽程 -->
      <div class="bracket-section">
        <div class="section-title">
          <span>🏆 勝部對戰組 (Main Bracket)</span>
          <span id="hostStatus" style="font-size:12px; color:#10b981;">● 雲端即時連線中</span>
        </div>
        <div class="match-list" id="mainMatchList">
          <p style="color:#64748b; font-size:14px;">尚未產生對戰表，請點選上方「隨機分組」</p>
        </div>
      </div>

      <!-- 敗部復活賽程 -->
      <div class="bracket-section">
        <div class="section-title">
          <span>🔥 敗部復活組 (Redemption Round)</span>
        </div>
        <div class="match-list" id="redemptionMatchList">
          <p style="color:#64748b; font-size:14px;">第一輪比賽結束後，敗方自動晉級此處展開復活賽！</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 學生 iPad 登入端 -->
  <div id="playerLoginView" class="view-container">
    <h2 style="margin-bottom:16px; color:#38bdf8;">進入單字拔河對戰</h2>
    <div class="form-group">
      <label>對戰桌號 (Table #):</label>
      <input type="number" id="inputTable" placeholder="例如：1" value="1">
    </div>
    <div class="form-group">
      <label>你是哪一方？</label>
      <select id="inputSide" style="width:100%; padding:10px; border-radius:6px; background:#0f172a; color:#fff; border:1px solid #475569;">
        <option value="1">🔴 紅方（上方選手）</option>
        <option value="2">🔵 藍方（下方選手）</option>
      </select>
    </div>
    <button class="btn btn-green" style="width:100%; padding:12px; font-size:16px;" onclick="joinMatch()">🚀 進入戰場</button>
  </div>

  <!-- 3. 拔河戰鬥畫面 -->
  <div id="arenaView">
    <!-- 上方紅方 (180度反轉) -->
    <div class="player-half p1-top">
      <div class="p-header">
        <span style="color:#f43f5e;" id="p1Label">🔴 紅方</span>
        <span id="p1Score">拉動: 0</span>
      </div>
      <div class="def-box" id="p1Def">載入中...</div>
      <div class="slots-container" id="p1Slots"></div>
      <div id="p1Kb"></div>
    </div>

    <!-- 中央拔河 -->
    <div class="tug-center">
      <div class="rope">
        <div class="ribbon" id="ribbon"></div>
      </div>
    </div>

    <!-- 下方藍方 (正常視角) -->
    <div class="player-half p2-bottom">
      <div class="p-header">
        <span style="color:#38bdf8;" id="p2Label">🔵 藍方</span>
        <span id="p2Score">拉動: 0</span>
      </div>
      <div class="def-box" id="p2Def">載入中...</div>
      <div class="slots-container" id="p2Slots"></div>
      <div id="p2Kb"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 1. FIREBASE 雲端連線設定
    // 請將下方 databaseURL 替換為您的 Realtime Database 網址
    // ==========================================
    const firebaseConfig = {
      databaseURL: "https://vocab-tournament-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 內建 B3L1~B3L3 題庫
    const WORD_LIST = [
      { word: "after all", def: "畢竟" }, { word: "be about to", def: "即將；正要" }, { word: "cheer up", def: "使......振奮" },
      { word: "confine", def: "侷限；使離不開" }, { word: "contact", def: "聯絡；接觸" }, { word: "drowsy", def: "昏昏欲睡的" },
      { word: "employ", def: "僱用" }, { word: "frighten", def: "使驚嚇" }, { word: "hesitate", def: "猶豫" },
      { word: "pass away", def: "過世" }, { word: "prompt", def: "促使；立即的" }, { word: "refuse", def: "拒絕" },
      { word: "adjust", def: "調整" }, { word: "architect", def: "建築師" }, { word: "capable", def: "有能力的" },
      { word: "collaborate", def: "合作" }, { word: "figure out", def: "想出" }, { word: "innovative", def: "創新的" },
      { word: "reliable", def: "可信賴的" }, { word: "trial and error", def: "反覆試驗" }, { word: "unique", def: "獨特的" },
      { word: "as a result", def: "因此" }, { word: "banish", def: "放逐" }, { word: "beneficial", def: "有益的" },
      { word: "conflict", def: "衝突；牴觸" }, { word: "enable", def: "使⋯⋯能夠" }, { word: "freeze", def: "冷凍；受凍" },
      { word: "make up for", def: "彌補" }, { word: "punish", def: "懲罰" }, { word: "run out of", def: "用完" }
    ];

    // 畫面切換
    function showView(viewId) {
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
      const target = document.getElementById(viewId);
      if (target) target.classList.add('active');
    }

    // ==========================================
    // 🖥️ 教師主控端：隨機分組與雲端監聽
    // ==========================================
    function generateTournament() {
      const rawText = document.getElementById('studentNames').value;
      const names = rawText.split(/[\n,]+/).map(s => s.trim()).filter(s => s);
      if (names.length < 2) {
        alert("請至少輸入兩位學生名單！");
        return;
      }

      // 洗牌
      const shuffled = [...names].sort(() => Math.random() - 0.5);
      const matches = {};
      let tableIndex = 1;

      for (let i = 0; i < shuffled.length; i += 2) {
        if (i + 1 < shuffled.length) {
          matches[`match_${tableIndex}`] = {
            table: tableIndex,
            p1: shuffled[i],
            p2: shuffled[i + 1],
            winner: null,
            status: 'waiting'
          };
          tableIndex++;
        }
      }

      // 寫入雲端
      db.ref('tournament').set({
        matches: matches,
        redemption: {}
      });
    }

    function resetTournament() {
      if (confirm("確定要重置比賽嗎？所有晉級記錄將清空。")) {
        db.ref('tournament').remove();
      }
    }

    // 監聽雲端比賽進度
    db.ref('tournament/matches').on('value', (snapshot) => {
      const matches = snapshot.val();
      const listElem = document.getElementById('mainMatchList');
      listElem.innerHTML = '';
      if (!matches) {
        listElem.innerHTML = '<p style="color:#64748b; font-size:14px;">尚未產生對戰表</p>';
        return;
      }

      const losers = [];
      Object.keys(matches).forEach(key => {
        const m = matches[key];
        const card = document.createElement('div');
        card.className = `match-card ${m.winner ? 'finished' : ''}`;
        card.innerHTML = `
          <div class="table-badge">桌號 ${m.table}</div>
          <div class="players-box">
            <span class="player-slot ${m.winner === m.p1 ? 'winner' : ''}">🔴 ${m.p1}</span>
            <span class="vs-tag">VS</span>
            <span class="player-slot ${m.winner === m.p2 ? 'winner' : ''}">🔵 ${m.p2}</span>
          </div>
          <div style="font-size:13px; font-weight:bold; color:${m.winner ? '#10b981':'#f59e0b'};">
            ${m.winner ? '🏆 ' + m.winner + ' 晉級' : '進行中'}
          </div>
        `;
        listElem.appendChild(card);

        // 收集敗部名單
        if (m.winner) {
          const loser = (m.winner === m.p1) ? m.p2 : m.p1;
          if (!losers.includes(loser)) losers.push(loser);
        }
      });

      renderRedemption(losers);
    });

    function renderRedemption(losers) {
      const redElem = document.getElementById('redemptionMatchList');
      redElem.innerHTML = '';
      if (losers.length === 0) {
        redElem.innerHTML = '<p style="color:#64748b; font-size:14px;">第一輪比賽結束後，敗方自動晉級此處展開復活賽！</p>';
        return;
      }
      for (let i = 0; i < losers.length; i += 2) {
        if (i + 1 < losers.length) {
          const card = document.createElement('div');
          card.className = 'match-card';
          card.innerHTML = `
            <div class="table-badge">復活桌 R${Math.floor(i/2) + 1}</div>
            <div class="players-box">
              <span class="player-slot">🔥 ${losers[i]}</span>
              <span class="vs-tag">VS</span>
              <span class="player-slot">🔥 ${losers[i+1]}</span>
            </div>
            <div style="font-size:13px; color:#f59e0b; font-weight:bold;">爭奪復活席位</div>
          `;
          redElem.appendChild(card);
        }
      }
    }

    // ==========================================
    // 📱 學生對戰端：進入拔河對決
    // ==========================================
    let currentMatchRef = null;
    let currentTable = 1;
    let myMatchData = null;
    let tugPos = 0; // -5 ~ +5

    const p1State = { typed: '', q: null };
    const p2State = { typed: '', q: null };

    function joinMatch() {
      currentTable = document.getElementById('inputTable').value;
      const matchKey = `match_${currentTable}`;

      db.ref(`tournament/matches/${matchKey}`).once('value', (snap) => {
        myMatchData = snap.val();
        if (!myMatchData) {
          alert(`找不到桌號 ${currentTable} 的對戰！請先由老師端抽籤。`);
          return;
        }

        document.getElementById('arenaView').style.display = 'flex';
        document.getElementById('p1Label').innerText = `🔴 ${myMatchData.p1}`;
        document.getElementById('p2Label').innerText = `🔵 ${myMatchData.p2}`;

        initPlayerArena();
      });
    }

    function initPlayerArena() {
      renderKb('p1Kb', 1);
      renderKb('p2Kb', 2);
      nextQ(1);
      nextQ(2);
      updateRopeUI();
    }

    function sanitize(w) { return w.toLowerCase().replace(/[^a-z\s']/g, ''); }

    function nextQ(playerId) {
      const q = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
      if (playerId === 1) {
        p1State.q = q; p1State.typed = '';
        renderSlots(1);
      } else {
        p2State.q = q; p2State.typed = '';
        renderSlots(2);
      }
    }

    function renderSlots(playerId) {
      const state = playerId === 1 ? p1State : p2State;
      const defElem = document.getElementById(playerId === 1 ? 'p1Def' : 'p2Def');
      const slotsWrap = document.getElementById(playerId === 1 ? 'p1Slots' : 'p2Slots');

      defElem.innerText = state.q.def;
      slotsWrap.innerHTML = '';
      const target = sanitize(state.q.word);

      for (let i = 0; i < target.length; i++) {
        const c = target[i];
        const s = document.createElement('div');
        if (c === ' ') {
          s.className = 'slot space';
        } else {
          s.className = 'slot';
          if (i < state.typed.length) {
            s.innerText = state.typed[i];
            s.classList.add('filled');
          }
        }
        slotsWrap.appendChild(s);
      }
    }

    function handleKey(playerId, key) {
      if (Math.abs(tugPos) >= 5) return;
      const state = playerId === 1 ? p1State : p2State;
      const target = sanitize(state.q.word);

      if (key === 'CLEAR') {
        state.typed = '';
      } else if (key === 'DEL') {
        state.typed = state.typed.slice(0, -1);
      } else {
        let nextIdx = state.typed.length;
        if (target[nextIdx] === ' ') {
          state.typed += ' ';
          nextIdx++;
        }
        if (state.typed.length < target.length && key === target[nextIdx].toUpperCase()) {
          state.typed += key.toLowerCase();
          if (state.typed === target) {
            // 答對，拉繩子！
            if (playerId === 1) tugPos -= 1;
            else tugPos += 1;
            updateRopeUI();

            if (Math.abs(tugPos) >= 5) {
              const winnerName = tugPos <= -5 ? myMatchData.p1 : myMatchData.p2;
              alert(`🎉 恭喜 ${winnerName} 拔河獲勝！結果已自動回傳大螢幕！`);
              db.ref(`tournament/matches/match_${currentTable}`).update({ winner: winnerName });
              document.getElementById('arenaView').style.display = 'none';
              showView('playerLoginView');
              return;
            }
            nextQ(playerId);
            return;
          }
        }
      }
      renderSlots(playerId);
    }

    function updateRopeUI() {
      const ribbon = document.getElementById('ribbon');
      ribbon.style.left = `${50 + (tugPos * 8)}%`;
      document.getElementById('p1Score').innerText = `拉動: ${Math.max(0, -tugPos)}`;
      document.getElementById('p2Score').innerText = `拉動: ${Math.max(0, tugPos)}`;
    }

    const KB = [
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L'],
      ['DEL','Z','X','C','V','B','N','M','CLEAR']
    ];

    function renderKb(id, pId) {
      const wrap = document.getElementById(id);
      wrap.innerHTML = '';
      KB.forEach(row => {
        const r = document.createElement('div');
        r.className = 'kb-row';
        row.forEach(k => {
          const b = document.createElement('button');
          b.className = 'kb-key' + (k.length > 1 ? ' func' : '');
          b.innerText = k;
          b.onpointerdown = (e) => { e.preventDefault(); handleKey(pId, k); };
          r.appendChild(b);
        });
        wrap.appendChild(r);
      });
    }
  </script>
</body>
</html>
