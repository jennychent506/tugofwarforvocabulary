<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>B3 英文單字片語拔河對決 (iPad 面對面版)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1e293b;
      color: #f8fafc;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部/玩家一（紅方）：180 度旋轉，供對面的學生正向操作 */
    .player-area.p1-top {
      transform: rotate(180deg);
      background: linear-gradient(180deg, #1e1e2e 0%, #2a1b24 100%);
    }

    /* 底部/玩家二（藍方）：正常方向 */
    .player-area.p2-bottom {
      background: linear-gradient(180deg, #16243b 0%, #1e1e2e 100%);
    }

    .player-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 16px;
      position: relative;
    }

    /* 資訊欄 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-p1 { background: #e11d48; color: #fff; }
    .badge-p2 { background: #2563eb; color: #fff; }

    /* 題目區 */
    .question-box {
      text-align: center;
      margin: 4px 0;
    }
    .lesson-tag {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 2px;
      display: block;
    }
    .definition {
      font-size: 18px;
      font-weight: 700;
      color: #fef08a;
      min-height: 26px;
      line-height: 1.3;
    }

    /* 拼字格子區 */
    .slots-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      min-height: 42px;
      margin: 4px 0;
    }
    .char-slot {
      width: 28px;
      height: 36px;
      border-bottom: 3px solid #64748b;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      transition: all 0.15s;
    }
    .char-slot.filled {
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .char-slot.space {
      border-bottom: none;
      width: 14px;
    }

    /* 鍵盤樣式 */
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 650px;
      margin: 0 auto;
      width: 100%;
    }
    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .key-btn {
      flex: 1;
      height: 42px;
      max-width: 52px;
      border: none;
      border-radius: 6px;
      background: #334155;
      color: #f8fafc;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 3px 0 #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s, background 0.1s;
    }
    .key-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0f172a;
      background: #475569;
    }
    .key-btn.action-key {
      flex: 1.5;
      max-width: 68px;
      font-size: 13px;
      background: #475569;
    }

    /* 中央拔河區域 */
    .tug-arena {
      height: 84px;
      background: #0f172a;
      border-top: 2px solid #334155;
      border-bottom: 2px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 0 20px;
    }
    .rope-track {
      position: relative;
      height: 14px;
      background: #78350f;
      border-radius: 7px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    }
    /* 拔河紅緞帶 */
    .red-ribbon {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 38px;
      background: #ef4444;
      border: 2px solid #fff;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
      transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .arena-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 13px;
      font-weight: 700;
    }
    .p1-score-label { color: #f43f5e; }
    .p2-score-label { color: #38bdf8; }

    /* 設定懸浮選單按鈕 */
    .btn-settings {
      position: absolute;
      right: 12px;
      top: calc(50% - 16px);
      z-index: 10;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #475569;
      color: #94a3b8;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 獲勝彈窗與設定彈窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-box {
      background: #1e293b;
      padding: 24px;
      border-radius: 14px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      border: 1px solid #475569;
    }
    .modal-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      margin-top: 15px;
      cursor: pointer;
      font-weight: bold;
    }
    .lesson-selector {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 15px 0;
    }
    .lesson-chip {
      padding: 6px 12px;
      background: #334155;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .lesson-chip.active {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 上方玩家：紅方（反轉 180 度，面對面的學生看是正向的） -->
  <div class="player-area p1-top" id="p1Area">
    <div class="header-bar">
      <span class="badge badge-p1">🔴 紅方隊友</span>
      <span id="p1Stats">連勝: 0</span>
    </div>
    <div class="question-box">
      <span class="lesson-tag" id="p1Lesson">B3L1</span>
      <div class="definition" id="p1Def">準備中...</div>
    </div>
    <div class="slots-wrap" id="p1Slots"></div>
    <div class="keyboard" id="p1Keyboard"></div>
  </div>

  <!-- 中央拔河繩 -->
  <div class="tug-arena">
    <button class="btn-settings" onclick="openSettings()">⚙️ 設定範圍</button>
    <div class="rope-track">
      <div class="red-ribbon" id="redRibbon"></div>
    </div>
    <div class="arena-info">
      <span class="p1-score-label">◀ 紅方推進: <span id="p1TugCount">0</span>/5</span>
      <span style="color:#64748b; font-size:11px;">拉過中線 5 步獲勝</span>
      <span class="p2-score-label">藍方推進: <span id="p2TugCount">0</span>/5 ▶</span>
    </div>
  </div>

  <!-- 下方玩家：藍方（正常視角） -->
  <div class="player-area p2-bottom" id="p2Area">
    <div class="header-bar">
      <span class="badge badge-p2">🔵 藍方隊友</span>
      <span id="p2Stats">連勝: 0</span>
    </div>
    <div class="question-box">
      <span class="lesson-tag" id="p2Lesson">B3L1</span>
      <div class="definition" id="p2Def">準備中...</div>
    </div>
    <div class="slots-wrap" id="p2Slots"></div>
    <div class="keyboard" id="p2Keyboard"></div>
  </div>

  <!-- 獲勝結算彈窗 -->
  <div class="modal-overlay" id="winModal">
    <div class="modal-box">
      <h2 id="winTitle" style="font-size:26px; margin-bottom:8px;">🏆 獲勝！</h2>
      <p id="winDesc" style="color:#cbd5e1; font-size:15px;"></p>
      <button class="modal-btn" onclick="restartGame()">再戰一局</button>
    </div>
  </div>

  <!-- 課次設定彈窗 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <h3 style="margin-bottom:10px;">📚 選擇出題範圍</h3>
      <div class="lesson-selector">
        <div class="lesson-chip active" id="chkL1" onclick="toggleLesson('L1')">B3L1</div>
        <div class="lesson-chip active" id="chkL2" onclick="toggleLesson('L2')">B3L2</div>
        <div class="lesson-chip active" id="chkL3" onclick="toggleLesson('L3')">B3L3</div>
      </div>
      <button class="modal-btn" onclick="applySettings()">儲存並重新開始</button>
    </div>
  </div>

        { word: "capability", def: "(n.) 能力" },
        { word: "capable", def: "(adj.) 有能力的；能夠⋯⋯的" },
        { word: "collaborate", def: "(vi.) 合作" },
        { word: "collaboration", def: "(n.) 合作" },
        { word: "construct", def: "(vt.) 建造" },
        { word: "construction", def: "(n.) 建築物；建造" },
        { word: "constructive", def: "(adj.) 有建設性的" },
        { word: "element", def: "(n.) 要素" },

        { word: "exploration", def: "(n.) 探索；探究" },
        { word: "explore", def: "(vt.) 探索" },
        { word: "feedback", def: "(n.) 回饋意見" },
        { word: "figure out", def: "想出" },
        { word: "get down to", def: "開始做某事" },
        { word: "graduate", def: "(n.) 大學畢業生；(vi.) 畢業" },
        { word: "graduation", def: "(n.) 畢業" },
        { word: "in charge", def: "主控；負責" },
        { word: "innovate", def: "(vi.) 創新" },
        { word: "innovation", def: "(n.) 新方法" },

        { word: "material", def: "(n.) （活動所需的）材料" },

        { word: "rank", def: "(vi./vt.) 排序為⋯⋯" },
        { word: "ranking", def: "(n.) 排名" },
        { word: "reliable", def: "(adj.) 可信賴的" },
        { word: "rely", def: "(vi.) 依賴；信任" },
        { word: "roll up one's sleeves", def: "挽起袖子（開始行動）" },
        { word: "route", def: "(n.) 途徑；路線" },
        { word: "slight", def: "(adj.) 細微的" },
        { word: "slightly", def: "(adv.) 稍微" },
        { word: "stability", def: "(n.) 穩定" },
        { word: "stable", def: "(adj.) 穩定的；穩固的" },
        { word: "structure", def: "(n.) 結構體；建築物" },
        { word: "trial and error", def: "反覆試驗" },
        { word: "unique", def: "(adj.) 獨特的" }
      ],
      L3: [
        { word: "as a result", def: "因此" },
        { word: "banish", def: "(vt.) 放逐" },
        { word: "banishment", def: "(n.) 放逐" },
        { word: "beneficial", def: "(adj.) 有利的；有幫助的" },
        { word: "benefit", def: "(n.) 益處；(vt.) 對⋯⋯有益" },
        { word: "civilization", def: "(n.) 文明" },
        { word: "conflict", def: "(n./vi.) 衝突；牴觸" },
        { word: "distribute", def: "(vt.) 分發；分配" },
        { word: "distribution", def: "(n.) 分配；分布" },
        { word: "enable", def: "(vt.) 使⋯⋯能夠⋯⋯" },
        { word: "fall victim to", def: "成為......的受害者" },
        { word: "feed on", def: "靠......為食" },
        { word: "freeze", def: "(vi./vt.) 受凍；冷凍；凍結" },
        { word: "fur", def: "(n.) （動物的）毛；毛皮" },
        { word: "furious", def: "(adj.) 暴怒的" },
        { word: "fury", def: "(n.) 狂怒" },
        { word: "generosity", def: "(n.) 慷慨" },
        { word: "generous", def: "(adj.) 慷慨的" },
        { word: "hollow", def: "(adj.) 中空的" },
        { word: "humankind", def: "(n.) 人類" },
        { word: "make up for", def: "彌補" },
        { word: "miserable", def: "(adj.) 悲慘的" },
        { word: "misery", def: "(n.) 慘況" },
        { word: "punish", def: "(vt.) 懲罰" },
        { word: "punishment", def: "(n.) 懲罰" },
        { word: "run out of", def: "用完" },
        { word: "set the stage for", def: "為......做好準備" },
        { word: "slaughter", def: "(vt./n.) 宰殺；屠殺" },
        { word: "theft", def: "(n.) 偷竊；偷竊罪" },
        { word: "torture", def: "(vt./n.) 折磨；折磨人的事物" },
        { word: "underneath", def: "(prep.) 在⋯⋯下" },
        { word: "universal", def: "(adj.) 普遍的" },
        { word: "universe", def: "(n.) 宇宙" },
        { word: "upright", def: "(adj./adv.) 直立的；直立地" },
        { word: "victim", def: "(n.) 受害者；罹難者" }
      ]
    };

    let activeLessons = ['L1', 'L2', 'L3'];
    let currentPool = [];
    let tugState = 0; // -5 代表紅方獲勝，+5 代表藍方獲勝
    const WIN_THRESHOLD = 5;

    const p1 = { id: 1, currentQ: null, typed: "", score: 0 };
    const p2 = { id: 2, currentQ: null, typed: "", score: 0 };

    // 音效合成（Web Audio API）
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, duration = 0.1, type = 'sine') {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const KB_LAYOUT = [
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L'],
      ['DEL','Z','X','C','V','B','N','M','CLEAR']
    ];

    function renderKeyboard(containerId, playerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      KB_LAYOUT.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'kb-row';
        row.forEach(key => {
          const btn = document.createElement('button');
          btn.className = 'key-btn';
          btn.innerText = key;
          if (key === 'DEL' || key === 'CLEAR') {
            btn.classList.add('action-key');
          }
          btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleKey(playerId, key);
          });
          rowDiv.appendChild(btn);
        });
        container.appendChild(rowDiv);
      });
    }

    function sanitizeWord(w) {
      return w.toLowerCase().replace(/[^a-z\s']/g, '');
    }

    function pickRandomQuestion() {
      if (currentPool.length === 0) return null;
      return currentPool[Math.floor(Math.random() * currentPool.length)];
    }

    function setNextQuestion(p) {
      p.currentQ = pickRandomQuestion();
      p.typed = "";
      renderPlayerQuestion(p);
    }

    function renderPlayerQuestion(p) {
      const isP1 = p.id === 1;
      const defElem = document.getElementById(isP1 ? 'p1Def' : 'p2Def');
      const lessonElem = document.getElementById(isP1 ? 'p1Lesson' : 'p2Lesson');
      const slotsWrap = document.getElementById(isP1 ? 'p1Slots' : 'p2Slots');

      defElem.innerText = p.currentQ.def;
      lessonElem.innerText = p.currentQ.lesson;
      slotsWrap.innerHTML = '';

      const target = sanitizeWord(p.currentQ.word);
      for (let i = 0; i < target.length; i++) {
        const char = target[i];
        const slot = document.createElement('div');
        if (char === ' ') {
          slot.className = 'char-slot space';
          slot.innerText = '';
        } else {
          slot.className = 'char-slot';
          if (i < p.typed.length) {
            slot.innerText = p.typed[i];
            slot.classList.add('filled');
          }
        }
        slotsWrap.appendChild(slot);
      }
    }

    function handleKey(playerId, key) {
      if (Math.abs(tugState) >= WIN_THRESHOLD) return;
      const p = playerId === 1 ? p1 : p2;
      const target = sanitizeWord(p.currentQ.word);

      if (key === 'CLEAR') {
        p.typed = "";
        playTone(220, 0.08);
      } else if (key === 'DEL') {
        p.typed = p.typed.slice(0, -1);
        playTone(300, 0.05);
      } else {
        let nextCharIndex = p.typed.length;
        if (target[nextCharIndex] === ' ') {
          p.typed += ' ';
          nextCharIndex++;
        }

        if (p.typed.length < target.length) {
          const expected = target[nextCharIndex].toUpperCase();
          if (key === expected) {
            p.typed += key.toLowerCase();
            playTone(480, 0.06);
            
            if (p.typed === target) {
              handleWordCorrect(p);
              return;
            }
          } else {
            playTone(180, 0.15, 'triangle');
          }
        }
      }
      renderPlayerQuestion(p);
    }

    function handleWordCorrect(p) {
      playTone(700, 0.15);
      setTimeout(() => playTone(950, 0.2), 80);

      if (p.id === 1) {
        tugState -= 1;
      } else {
        tugState += 1;
      }

      updateTugUI();

      if (Math.abs(tugState) >= WIN_THRESHOLD) {
        endGame(tugState <= -WIN_THRESHOLD ? '紅方' : '藍方');
      } else {
        setNextQuestion(p);
      }
    }

    function updateTugUI() {
      const ribbon = document.getElementById('redRibbon');
      const percentage = 50 + (tugState * 7.5);
      ribbon.style.left = `${percentage}%`;

      document.getElementById('p1TugCount').innerText = Math.max(0, -tugState);
      document.getElementById('p2TugCount').innerText = Math.max(0, tugState);
    }

    function endGame(winner) {
      playTone(523, 0.2);
      setTimeout(() => playTone(659, 0.2), 120);
      setTimeout(() => playTone(783, 0.4), 240);

      const modal = document.getElementById('winModal');
      document.getElementById('winTitle').innerText = `🎉 恭喜 ${winner} 獲勝！`;
      document.getElementById('winDesc').innerText = `力量十足！成功把拔河繩拉過指定界線！`;
      modal.style.display = 'flex';
    }

    function restartGame() {
      document.getElementById('winModal').style.display = 'none';
      tugState = 0;
      updateTugUI();
      buildPool();
      setNextQuestion(p1);
      setNextQuestion(p2);
    }

    function buildPool() {
      currentPool = [];
      activeLessons.forEach(l => {
        RAW_DATABASE[l].forEach(item => {
          currentPool.push({ ...item, lesson: `B3${l}` });
        });
      });
    }

    function openSettings() {
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function toggleLesson(lessonKey) {
      const chip = document.getElementById(`chk${lessonKey}`);
      if (activeLessons.includes(lessonKey)) {
        if (activeLessons.length === 1) return;
        activeLessons = activeLessons.filter(k => k !== lessonKey);
        chip.classList.remove('active');
      } else {
        activeLessons.push(lessonKey);
        chip.classList.add('active');
      }
    }

    function applySettings() {
      document.getElementById('settingsModal').style.display = 'none';
      restartGame();
    }

    window.onload = () => {
      renderKeyboard('p1Keyboard', 1);
      renderKeyboard('p2Keyboard', 2);
      buildPool();
      setNextQuestion(p1);
      setNextQuestion(p2);
      updateTugUI();
    };
  </script>
</body>
</html>
