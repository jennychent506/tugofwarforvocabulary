<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我是全能拼字王！無限輪轉爭霸賽</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --dopa-pink: #ff2a85;
      --dopa-yellow: #ffdf00;
      --dopa-blue: #00d2ff;
      --dopa-green: #05ffa1;
      --dopa-purple: #7928ca;
      --dopa-bg: #fff5ea;
      --dopa-dark: #181824;
      --dopa-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    }

    body {
      background-color: var(--dopa-bg);
      background-image: radial-gradient(#ffd3b6 15%, transparent 16%), radial-gradient(#a8e6cf 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      color: var(--dopa-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 頂部多巴胺色彩條 */
    header {
      background: #ffffff;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 5px solid var(--dopa-dark);
      box-shadow: 0 6px 0 rgba(0,0,0,0.1);
      position: relative;
      z-index: 10;
    }
    .brand-title {
      font-size: 2.3rem;
      font-weight: 900;
      color: var(--dopa-pink);
      text-shadow: 3px 3px 0 var(--dopa-yellow), 5px 5px 0 var(--dopa-dark);
      letter-spacing: 2px;
    }
    .nav-btns { display: flex; gap: 12px; }
    .btn {
      border: 3.5px solid var(--dopa-dark);
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 900;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 5px 0 var(--dopa-dark);
      transition: transform 0.1s;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--dopa-dark);
    }
    .btn-screen { background: var(--dopa-green); color: var(--dopa-dark); }
    .btn-ipad { background: var(--dopa-yellow); color: var(--dopa-dark); }
    .btn-fire { background: var(--dopa-pink); color: #fff; }

    /* 容器控制：預設 block 確保不會一片空白 */
    .view-container { 
      padding: 20px 24px; 
      width: 98%; 
      max-width: 1800px; 
      margin: 0 auto; 
    }

    /* ====== 大螢幕模式 (Home) ====== */
    .admin-card {
      background: #ffffff;
      border: 4px solid var(--dopa-dark);
      border-radius: 24px;
      padding: 20px 28px;
      margin-bottom: 20px;
      box-shadow: 8px 8px 0 var(--dopa-dark);
    }
    .scope-selector {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .scope-chip {
      padding: 8px 20px;
      border: 3px solid var(--dopa-dark);
      border-radius: 30px;
      font-weight: 900;
      font-size: 17px;
      cursor: pointer;
      background: #f1f5f9;
      box-shadow: 0 4px 0 var(--dopa-dark);
    }
    .scope-chip.active {
      background: var(--dopa-yellow);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--dopa-dark);
    }

    .names-area {
      width: 100%;
      height: 70px;
      border: 3px solid var(--dopa-dark);
      border-radius: 16px;
      padding: 10px 16px;
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 14px;
      background: #fafafa;
    }

    .waiting-status-bar {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 2px dashed #cbd5e1;
    }
    .waiting-pill {
      background: #f1f5f9;
      border: 2px solid var(--dopa-dark);
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 15px;
      font-weight: 900;
    }

    /* 三欄超寬面板 */
    .arena-dashboard {
      display: grid;
      grid-template-columns: 1.65fr 1.15fr 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1200px) {
      .arena-dashboard { grid-template-columns: 1fr; }
    }

    .box-card {
      background: #ffffff;
      border: 4px solid var(--dopa-dark);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 6px 6px 0 var(--dopa-dark);
    }
    .box-header {
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 3px dashed #cbd5e1;
    }

    .match-list-scroll {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 750px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .match-item {
      background: #f8fafc;
      border: 3.5px solid var(--dopa-dark);
      border-radius: 18px;
      padding: 12px 18px;
      box-shadow: 0 4px 0 var(--dopa-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      overflow: hidden;
    }
    .match-item.done {
      background: #e6fffa;
      border-color: #059669;
    }

    .table-badge-ui {
      font-weight: 900;
      background: var(--dopa-yellow);
      padding: 6px 14px;
      border-radius: 12px;
      border: 3px solid var(--dopa-dark);
      font-size: 17px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .vs-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
    }

    .p-tag {
      font-size: 19px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 10px;
      white-space: nowrap;
      display: inline-block;
    }
    .p-tag.winner-mark {
      background: var(--dopa-green);
      border: 2px solid var(--dopa-dark);
    }

    .match-status-label {
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 750px;
      overflow-y: auto;
    }
    .rank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 14px;
      border: 3px solid var(--dopa-dark);
      background: #fff;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 4px 0 var(--dopa-dark);
      white-space: nowrap;
    }
    .rank-row:nth-child(1) { background: #fff9c4; font-size: 20px; }
    .rank-row:nth-child(2) { background: #e0f2fe; }
    .rank-row:nth-child(3) { background: #ffedd5; }
    .score-badge {
      background: var(--dopa-pink);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 900;
    }

    /* ====== 學生 iPad 登入端 ====== */
    #playerLoginView {
      max-width: 500px;
      margin: 60px auto;
      background: #fff;
      border: 5px solid var(--dopa-dark);
      border-radius: 30px;
      padding: 36px;
      box-shadow: 10px 10px 0 var(--dopa-dark);
      text-align: center;
      display: none;
    }
    .dopa-input {
      width: 100%;
      padding: 16px;
      border: 3px solid var(--dopa-dark);
      border-radius: 18px;
      font-size: 22px;
      font-weight: 900;
      margin-top: 10px;
      margin-bottom: 22px;
      text-align: center;
      background: #fffdf5;
    }

    /* ====== 拔河對戰實體 (iPad 面對面) ====== */
    #arenaView {
      position: fixed;
      inset: 0;
      background: var(--dopa-bg);
      z-index: 1000;
      display: none;
      flex-direction: column;
    }
    .player-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 24px;
      position: relative;
    }
    .player-zone.p1-up {
      transform: rotate(180deg);
      background: linear-gradient(180deg, #ffc0d3 0%, #fff1f5 100%);
      border-bottom: 5px solid var(--dopa-dark);
    }
    .player-zone.p2-down {
      background: linear-gradient(180deg, #dcfce7 0%, #f0fdf4 100%);
      border-top: 5px solid var(--dopa-dark);
    }

    .player-zone.frozen .keyboard-wrapper {
      pointer-events: none;
      opacity: 0.35;
    }

    .p-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .p-name-badge {
      font-size: 26px;
      font-weight: 900;
      padding: 6px 20px;
      border-radius: 50px;
      border: 4px solid var(--dopa-dark);
      box-shadow: 0 4px 0 var(--dopa-dark);
    }
    .p-name-badge.red { background: var(--dopa-pink); color: #fff; }
    .p-name-badge.blue { background: var(--dopa-blue); color: var(--dopa-dark); }

    .freeze-badge {
      display: none;
      background: #ef4444;
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      padding: 4px 16px;
      border-radius: 30px;
      border: 3px solid #000;
    }

    .word-def-box {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      color: var(--dopa-dark);
      background: #ffffff;
      border: 4px solid var(--dopa-dark);
      border-radius: 20px;
      padding: 10px 18px;
      box-shadow: 0 6px 0 var(--dopa-dark);
      max-width: 900px;
      margin: 4px auto;
      line-height: 1.3;
    }

    .slots-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 56px;
      margin: 4px 0;
    }
    .tile {
      width: 44px;
      height: 54px;
      border: 3.5px solid var(--dopa-dark);
      border-radius: 12px;
      background: #ffffff;
      font-size: 32px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      box-shadow: 0 5px 0 var(--dopa-dark);
    }
    .tile.active-char {
      background: var(--dopa-yellow);
      color: var(--dopa-dark);
      transform: scale(1.08);
    }
    .tile.space-tile {
      border: none;
      background: transparent;
      box-shadow: none;
      width: 20px;
    }

    .keyboard-wrapper {
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }
    .key-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    .dopa-key {
      flex: 1;
      height: 52px;
      max-width: 66px;
      border: 3.5px solid var(--dopa-dark);
      border-radius: 14px;
      background: #ffffff;
      color: var(--dopa-dark);
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 5px 0 var(--dopa-dark);
      cursor: pointer;
    }
    .dopa-key:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--dopa-dark);
      background: var(--dopa-yellow);
    }
    .dopa-key.action-btn {
      flex: 1.5;
      max-width: 90px;
      font-size: 17px;
      background: #ffd3b6;
    }
    .dopa-key.quote-btn {
      background: #e0f2fe;
    }

    .arena-divider {
      height: 68px;
      background: var(--dopa-yellow);
      border-top: 5px solid var(--dopa-dark);
      border-bottom: 5px solid var(--dopa-dark);
      display: flex;
      align-items: center;
      position: relative;
      padding: 0 30px;
    }
    .giant-rope {
      width: 100%;
      height: 18px;
      background: #a16207;
      border: 3.5px solid var(--dopa-dark);
      border-radius: 999px;
      position: relative;
    }
    .bow-ribbon {
      position: absolute;
      width: 36px;
      height: 50px;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--dopa-pink);
      border: 3.5px solid var(--dopa-dark);
